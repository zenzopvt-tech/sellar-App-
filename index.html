<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BLYNZO - Seller Partner</title>
  <style>
    :root{
      --lime:#B6F500; --lime-dark:#8FCC00; --lime-soft:#F2FFD0;
      --black:#0A0A0A; --ink:#141414; --panel:#FFFFFF; --line:#E7E7E4;
      --muted:#6B6F66; --bg:#F5F6F2; --danger:#E5484D; --ok:#1F9D55; --warn:#D97706; --info:#2563EB;
      --r:14px; --shadow:0 8px 24px rgba(10,10,10,.08);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
    button{font-family:inherit;cursor:pointer;border:none}
    input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--lime-dark)}
    label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px;color:#3a3d38}
    .req::after{content:" *";color:var(--danger)}
    .hint{font-size:12px;color:var(--muted);margin-top:4px}

    /* ---------- auth screens ---------- */
    .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
      background:radial-gradient(1200px 500px at 50% -10%, #26300a 0%, var(--black) 55%)}
    .auth-card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
    .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
    .logo{width:76px;height:76px;border-radius:20px;background:var(--black);color:var(--lime);display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:26px;letter-spacing:1px;border:3px solid var(--lime);overflow:hidden}
    .logo img{width:100%;height:100%;object-fit:cover}
    .brand-name{font-size:30px;font-weight:900;letter-spacing:5px;color:var(--black)}
    .brand-name span{color:#7fb300}
    .welcome{color:var(--muted);font-size:13.5px;text-align:center;margin:4px 0 18px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:12px;font-weight:700;font-size:15.5px;transition:.15s}
    .btn-lime{background:var(--lime);color:var(--black)}
    .btn-lime:active{transform:scale(.98)}
    .btn-dark{background:var(--black);color:#fff}
    .btn-ghost{background:#F1F2EC;color:var(--ink)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;width:auto}
    .btn[disabled]{opacity:.55;pointer-events:none}
    .auth-alt{margin-top:14px;text-align:center;font-size:13.5px;color:var(--muted)}
    .link{color:#5c8a00;font-weight:700;text-decoration:none;cursor:pointer}
    .field-wrap{position:relative}
    .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;font-size:16px;padding:6px;color:var(--muted)}
    .row2{display:flex;align-items:center;justify-content:space-between;margin:12px 0;font-size:13.5px}
    .chk{display:flex;align-items:center;gap:8px}
    .chk input{width:18px;height:18px}
    .seg{display:flex;gap:8px;margin-bottom:14px}
    .seg button{flex:1;padding:12px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:700}
    .seg button.on{border-color:var(--lime-dark);background:var(--lime-soft);color:#3d5400}
    .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

    /* ---------- stepper ---------- */
    .stepper{display:flex;gap:4px;margin:6px 0 16px}
    .stepper div{flex:1;height:5px;border-radius:3px;background:var(--line)}
    .stepper div.on{background:var(--lime-dark)}
    .step-title{font-weight:800;font-size:16px;margin-bottom:2px}
    .step-sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
    .review-block{background:#FAFBF7;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
    .review-block h4{font-size:13px;color:#5c8a00;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed #EDEEE8}
    .kv b{color:#3a3d38;font-weight:600}
    .kv span{text-align:right;color:var(--ink);word-break:break-word}

    /* ---------- success screen ---------- */
    .success-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:linear-gradient(160deg,#123d1f 0%,#0A0A0A 70%)}
    .success-card{background:#fff;border-radius:22px;max-width:430px;width:100%;padding:30px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
    .tick{width:84px;height:84px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 14px;color:var(--black)}
    .cred-box{background:#0e1400;border:1.5px solid var(--lime-dark);border-radius:14px;padding:14px;margin:14px 0;color:#fff}
    .cred-box .lbl{font-size:11px;letter-spacing:2px;color:#b7d94c}
    .cred-box .val{font-size:24px;font-weight:900;color:var(--lime);letter-spacing:2px;margin:2px 0 10px}
    .cred-actions{display:flex;gap:8px;justify-content:center}

    /* ---------- app shell ---------- */
    #shell{display:none;min-height:100vh}
    header.top{position:sticky;top:0;z-index:40;background:var(--black);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
    header.top .mini-logo{width:38px;height:38px;border-radius:10px;background:#000;border:2px solid var(--lime);color:var(--lime);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;flex-shrink:0}
    header.top .mini-logo img{width:100%;height:100%;object-fit:cover}
    header.top .tt{font-weight:900;letter-spacing:2px;font-size:16px}
    header.top .tt small{display:block;font-size:10.5px;letter-spacing:.4px;color:#9aa48b;font-weight:600}
    .top-spacer{flex:1}
    .icon-btn{position:relative;background:#1c1c1c;border:1px solid #2c2c2c;color:#fff;width:38px;height:38px;border-radius:10px;font-size:17px;display:flex;align-items:center;justify-content:center}
    .dot{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
    .burger{background:none;color:#fff;font-size:22px;width:38px;height:38px}
    #sidebar{position:fixed;z-index:60;top:0;left:0;bottom:0;width:262px;background:var(--black);color:#fff;transform:translateX(-105%);transition:.22s;overflow-y:auto;padding:14px 10px 80px}
    #sidebar.open{transform:none}
    #scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none}
    #scrim.open{display:block}
    .side-brand{display:flex;align-items:center;gap:10px;padding:8px 8px 16px}
    .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:#cfd4c8;font-weight:600;font-size:14px;margin:2px 0}
    .nav-item .ic{width:22px;text-align:center}
    .nav-item.on{background:var(--lime);color:var(--black)}
    .nav-sec{font-size:10.5px;letter-spacing:1.5px;color:#77806b;padding:14px 12px 4px;font-weight:800}
    main#content{padding:14px 14px 96px;max-width:1020px;margin:0 auto}
    #bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:45;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
    #bottomnav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:5px 0;border-radius:10px}
    #bottomnav button.on{color:#5c8a00;background:var(--lime-soft)}
    #bottomnav .ic{font-size:19px}
    @media(min-width:900px){ #bottomnav{display:none} main#content{margin-left:276px;padding-bottom:40px} }

    /* ---------- cards / lists ---------- */
    .page-title{font-size:19px;font-weight:800;margin:2px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
    .cards.c3{grid-template-columns:repeat(2,1fr)} @media(min-width:700px){.cards.c3{grid-template-columns:repeat(3,1fr)}}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
    .stat .n{font-size:24px;font-weight:900}
    .stat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
    .stat .ic{font-size:18px;float:right;opacity:.7}
    .stat.lime{background:var(--black);border-color:var(--black)}
    .stat.lime .n{color:var(--lime)} .stat.lime .l{color:#a9b49a}
    .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
    .panel h3{font-size:15px;margin-bottom:10px}
    .searchbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .searchbar input,.searchbar select{flex:1;min-width:130px}
    .chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.3px}
    .chip.green{background:#E4F7D8;color:#2e6b00} .chip.red{background:#FDE3E4;color:#B42318}
    .chip.amber{background:#FEF0DC;color:#B45309} .chip.blue{background:#E0EAFF;color:#1D4ED8}
    .chip.gray{background:#EDEFE9;color:#5b6058} .chip.black{background:var(--black);color:var(--lime)}
    .chip.lime{background:var(--lime);color:var(--black)}
    .list-item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:9px;box-shadow:var(--shadow)}
    .list-item .li-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .list-item .li-title{font-weight:800;font-size:14.5px}
    .list-item .li-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
    .li-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .empty{text-align:center;color:var(--muted);padding:38px 16px;background:#fff;border:1.5px dashed var(--line);border-radius:var(--r)}
    .empty .e-ic{font-size:34px;margin-bottom:8px}
    .pager{display:flex;gap:6px;justify-content:center;align-items:center;margin:14px 0;font-size:13px;color:var(--muted)}
    .pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-weight:700}
    .pager button[disabled]{opacity:.4}
    table.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
    .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);background:#fff}
    .tbl th{background:var(--black);color:var(--lime);text-align:left;padding:10px 8px;font-size:11.5px;letter-spacing:.5px;white-space:nowrap}
    .tbl td{padding:10px 8px;border-bottom:1px solid #F0F1EC;white-space:nowrap}
    .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .filters button{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:12.5px}
    .filters button.on{background:var(--black);color:var(--lime);border-color:var(--black)}
    .banner{border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px}
    .banner.warn{background:#FFF6E5;border:1px solid #F3D9A4;color:#92580a}
    .banner.info{background:#EAF2FF;border:1px solid #C3D7FE;color:#1e4fc2}
    .banner.lime{background:var(--lime-soft);border:1px solid #cdea7a;color:#42590a}
    img.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#f4f4f0}
    .flex{display:flex;gap:10px;align-items:center}
    .grow{flex:1}
    .mt{margin-top:12px}.mb{margin-bottom:12px}
    .grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
    @media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
    .sec-h{font-size:12px;font-weight:800;letter-spacing:1.2px;color:#77806b;text-transform:uppercase;margin:16px 0 8px}

    /* ---------- chat ---------- */
    .chat{display:flex;flex-direction:column;gap:8px;padding:12px;background:#F7F8F3;border:1px solid var(--line);border-radius:var(--r);height:46vh;overflow-y:auto;margin-bottom:10px}
    .bub{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45}
    .bub .who{font-size:10.5px;font-weight:800;opacity:.65;margin-bottom:2px}
    .bub .when{font-size:10px;opacity:.55;margin-top:3px}
    .bub.me{align-self:flex-end;background:var(--black);color:#fff;border-bottom-right-radius:4px}
    .bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
    .chat-in{display:flex;gap:8px}
    .chat-in input{flex:1}

    /* ---------- modal / toast / loader ---------- */
    #modal-root{display:none;position:fixed;inset:0;z-index:90;background:rgba(8,8,8,.55);align-items:flex-end;justify-content:center}
    @media(min-width:640px){#modal-root{align-items:center}}
    #modal-root.open{display:flex}
    .modal{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:18px}
    @media(min-width:640px){.modal{border-radius:20px}}
    .modal h3{margin-bottom:12px;font-size:17px}
    .modal-actions{display:flex;gap:8px;margin-top:16px}
    #toast-wrap{position:fixed;top:14px;left:0;right:0;z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
    .toast{background:var(--black);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:92%}
    .toast.err{background:var(--danger)} .toast.ok{background:#173f00;color:var(--lime)}
    #loader{display:none;position:fixed;inset:0;z-index:110;background:rgba(255,255,255,.55);align-items:center;justify-content:center}
    #loader.open{display:flex}
    .spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--lime-dark);animation:sp .8s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .skel{height:64px;border-radius:var(--r);background:linear-gradient(90deg,#ececec,#f7f7f4,#ececec);background-size:200% 100%;animation:sk 1.1s infinite;margin-bottom:9px}
    @keyframes sk{to{background-position:-200% 0}}
    .shop-head{display:flex;gap:12px;align-items:center;background:var(--black);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
    .shop-head img{width:56px;height:56px;border-radius:12px;object-fit:cover;border:2px solid var(--lime)}
    .shop-head .n{font-weight:900;font-size:16px}
    .shop-head .s{font-size:12px;color:#aab49a;margin-top:2px}
    .noti-item{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
    .noti-item.unread{border-left:4px solid var(--lime-dark);background:#FCFFF2}
    .noti-item .ic{font-size:18px}
    .noti-item .t{font-weight:800;font-size:13.5px}
    .noti-item .b{font-size:13px;color:#4a4d47;margin-top:2px;line-height:1.45}
    .noti-item .w{font-size:11px;color:var(--muted);margin-top:4px}
  </style>
</head>
<body>
  <div id="auth-root"></div>

  <div id="shell">
    <header class="top">
      <button class="burger" onclick="toggleSidebar(true)">☰</button>
      <div class="mini-logo" id="hd-logo">B</div>
      <div class="tt"><span id="hd-brand">BLYNZO</span><small id="hd-sub">Seller Partner</small></div>
      <div class="top-spacer"></div>
      <button class="icon-btn" onclick="openNotifications()">🔔<span class="dot" id="bell-dot" style="display:none">0</span></button>
      <button class="icon-btn" onclick="doLogout()" title="Logout">⏻</button>
    </header>
    <div id="scrim" onclick="toggleSidebar(false)"></div>
    <aside id="sidebar"></aside>
    <main id="content"></main>
    <nav id="bottomnav"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-wrap"></div>
  <div id="loader"><div class="spin"></div></div>

  <script>
/* ================= BLYNZO FRONTEND CORE ================= */
'use strict';

var S = { token: null, role: null, boot: null, cfg: null, page: null, params: {}, cache: { sellers: [], categories: [] }, timers: {} };
var PAGE_SIZE = 10;

/* ---------- api ---------- */
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    try {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
        var msg = (err && err.message) ? err.message : String(err);
        if (msg === 'SESSION_EXPIRED') { forceLogout('Session expired. Please log in again.'); reject(err); return; }
        if (msg === 'ACCESS_DENIED') { toast('You are not allowed to perform this action.', 'err'); reject(err); return; }
        reject(err);
      });
      runner[fn].apply(runner, args);
    } catch (e) { reject(e); }
  });
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  showLoader();
  return api.apply(null, [fn].concat(args)).then(function (r) { hideLoader(); return r; }, function (e) { hideLoader(); toast((e && e.message) ? e.message : 'Something went wrong. Check your network.', 'err'); throw e; });
}

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function money(v) { return '\u20B9' + (Math.round(Number(v || 0) * 100) / 100).toLocaleString('en-IN'); }
function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  $('toast-wrap').appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; t.style.transition = '.4s'; }, 2600);
  setTimeout(function () { t.remove(); }, 3100);
}
function showLoader() { $('loader').classList.add('open'); }
function hideLoader() { $('loader').classList.remove('open'); }
function statusChip(st) {
  var map = { Active: 'green', Completed: 'green', Paid: 'green', Approved: 'green', Answered: 'green', Ended: 'gray', Archived: 'gray', Read: 'gray',
    Pending: 'amber', 'Pending Acceptance': 'amber', Open: 'amber', Unpaid: 'amber', Ongoing: 'blue', Scheduled: 'blue', Processing: 'blue', Assigned: 'blue', Accepted: 'blue', Reopened: 'blue', 'In Stock': 'green', 'Low Stock': 'amber',
    Inactive: 'gray', Rejected: 'red', Cancelled: 'red', Suspended: 'red', 'Out of Stock': 'red', New: 'lime' };
  return '<span class="chip ' + (map[st] || 'gray') + '">' + esc(st || '-') + '</span>';
}
function copyText(txt) {
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(function () { toast('Copied: ' + txt, 'ok'); }); return; }
  var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copied: ' + txt, 'ok'); } catch (e) { toast('Copy failed', 'err'); }
  ta.remove();
}
function downloadTxt(filename, text) {
  var a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function toCSV(rows) {
  if (!rows || !rows.length) return '';
  var keys = Object.keys(rows[0]);
  var esc = function (v) { return '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"'; };
  return keys.join(',') + '\n' + rows.map(function (r) { return keys.map(function (k) { return esc(r[k]); }).join(','); }).join('\n');
}
function exportCSV(rows, name) {
  if (!rows || !rows.length) { toast('Nothing to export.', 'err'); return; }
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(toCSV(rows));
  a.download = name + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Exported ' + rows.length + ' rows.', 'ok');
}
function printReport(title, html) {
  var w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups to print reports.', 'err'); return; }
  w.document.write('<html><head><title>' + title + '</title><style>body{font-family:Arial;padding:24px}h1{font-size:20px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #999;padding:6px;text-align:left}th{background:#eee}</style></head><body><h1>' + title + '</h1><p>BLYNZO Seller Partner - generated ' + new Date().toLocaleString() + '</p>' + html + '</body></html>');
  w.document.close();

function timeAgo(s) {
  if (!s) return '';
  var d = new Date(String(s).replace(' ', 'T'));
  if (isNaN(d)) return s;
  var diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return String(s).slice(0, 10);
}

/* ---------- form builder ---------- */
function fieldHTML(f, val) {
  var v = val === undefined || val === null ? (f.def !== undefined ? f.def : '') : val;
  var req = f.req ? ' req' : '';
  var id = 'f_' + f.k;
  var ph = f.ph ? ' placeholder="' + esc(f.ph) + '"' : '';
  var inner;
  if (f.type === 'select') {
    inner = '<select id="' + id + '"' + ph + '>' + (f.opts || []).map(function (o) {
      return '<option value="' + esc(o) + '"' + (String(o) === String(v) ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('') + '</select>';
  } else if (f.type === 'textarea') {
    inner = '<textarea id="' + id + '" rows="3"' + ph + '>' + esc(v) + '</textarea>';
  } else if (f.type === 'file') {
    inner = '<input type="file" id="' + id + '" accept="' + (f.accept || 'image/*') + '"' + (f.any ? '' : '') + '>';
  } else {
    var t = f.type || 'text';
    inner = '<input type="' + t + '" id="' + id + '" value="' + esc(v) + '"' + ph + (f.min ? ' min="' + f.min + '"' : '') + '>';
  }
  return '<label class="' + req.trim() + '" for="' + id + '">' + esc(f.label) + '</label>' + inner + (f.hint ? '<div class="hint">' + f.hint + '</div>' : '');
}
function buildFields(defs, vals) {
  return defs.map(function (f) { return fieldHTML(f, vals ? vals[f.k] : undefined); }).join('');
}
function collectFields(defs) {
  var out = {}, ok = true, firstBad = null;
  defs.forEach(function (f) {
    var el = $('f_' + f.k);
    if (!el) return;
    var v = el.value;
    if (f.type === 'file') {
      var file = el.files && el.files[0];
      out[f.k] = file ? file : null;
      if (f.req && !file) { ok = false; firstBad = firstBad || el; el.style.borderColor = '#E5484D'; }
      return;
    }
    if (f.req && !String(v).trim()) { ok = false; firstBad = firstBad || el; el.style.borderColor = '#E5484D'; }
    else el.style.borderColor = '';
    out[f.k] = v;
  });
  if (!ok) { if (firstBad) firstBad.focus(); throw new Error('Please fill all required fields.'); }
  return out;
}
function fileToB64(file) {
  return new Promise(function (res, rej) {
    if (!file) { res(null); return; }
    if (file.size > 5 * 1024 * 1024) { rej(new Error('File too large (max 5 MB): ' + file.name)); return; }
    var r = new FileReader();
    r.onload = function () {
      var parts = String(r.result).split(',');
      res({ name: file.name, mimeType: file.type, data: parts[1] });
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ---------- pagination ---------- */
function paginate(key, arr) {
  var per = PAGE_SIZE;
  var st = S.cache['pg_' + key] || 1;
  var pages = Math.max(1, Math.ceil(arr.length / per));
  if (st > pages) st = pages;
  S.cache['pg_' + key] = st;
  var slice = arr.slice((st - 1) * per, st * per);
  var pager = arr.length > per ?
    '<div class="pager"><button ' + (st <= 1 ? 'disabled' : '') + ' onclick="pgPrev(\'' + key + '\')">Prev</button><span>Page ' + st + ' of ' + pages + ' (' + arr.length + ')</span><button ' + (st >= pages ? 'disabled' : '') + ' onclick="pgNext(\'' + key + '\')">Next</button></div>' : '';
  return { slice: slice, pager: pager };
}
function pgNext(k) { S.cache['pg_' + k] = (S.cache['pg_' + k] || 1) + 1; refresh(); }
function pgPrev(k) { S.cache['pg_' + k] = Math.max(1, (S.cache['pg_' + k] || 1) - 1); refresh(); }

function regNav(dir) {
  if (dir === 1 && REG.step === 4) { regSubmit(); return; }
  if (dir === 1) {
    var defs = regFieldsForStep(REG.step);
    if (defs.length) {
      var vals;
      try { vals = collectFields(defs); } catch (e) { toast(e.message, 'err'); return; }
      var files = {};
      var pending = [];
      defs.forEach(function (f) {
        if (f.type === 'file') {
          if (vals[f.k]) pending.push(fileToB64(vals[f.k]).then(function (b) { files[f.k] = b; }));
          delete vals[f.k];
        }
      });
      if (vals.mobile && !/^\d{10}$/.test(String(vals.mobile).replace(/\D/g, '').slice(-10))) {
        if (REG.step === 0 && String(vals.mobile).replace(/\D/g, '').length < 10) { toast('Enter a valid 10-digit mobile number.', 'err'); return; }
      }
      Promise.all(pending).then(function () {
        Object.assign(REG.data, vals, files);
        REG.step++;
        regRender();
        window.scrollTo(0, 0);
      }).catch(function (e) { toast(e.message, 'err'); });
      return;
    }
    REG.step++;
    regRender();
    window.scrollTo(0, 0);
    return;
  }
  REG.step = Math.max(0, REG.step + dir);
  regRender();
  window.scrollTo(0, 0);

    }).catch(function () {});
  }, 60000);
  S.timers.page = setInterval(function () {
    if (!S.token) return;

function ocAddItem() {
  var pid = $('oc-prod').value, qty = Number($('oc-qty').value) || 1;
  if (!pid) { toast('Select a product.', 'err'); return; }

  if (!p) return;
  if (OC.sellerId && p.Seller_ID !== OC.sellerId) { toast('Product belongs to another seller. Pick a product of the selected seller.', 'err'); return; }
  if (!OC.sellerId) { OC.sellerId = p.Seller_ID; }
  var ex = OC.items.filter(function (i) { return i.productId === pid; })[0];

  else OC.items.push({ productId: pid, productName: p.Name, qty: qty, price: Number(p.Selling_Price) });

    var st = S.role === 'admin' ? $('tkr-s').value : '';
    closeModal();
    call('apiReplyTicket', S.token, ticketId, r, st).then(function (x) { toast(x.message, 'ok'); refresh(); }).catch(function () {});
  };
}

/* ---------- seller: profile ---------- */
PAGES.profile = function () {
  return call('apiGetSellerProfile', S.token).then(function (d) {
    var se = d.seller || {}, sh = d.shop || {}, bank = d.bank || {};
    var kv = function (l, v) { return '<div class="kv"><b>' + esc(l) + '</b><span>' + esc(v || '-') + '</span></div>'; };
    var acct = String(bank.Account_Number || '');
    var maskedAcct = acct ? ('\u2022\u2022\u2022\u2022' + acct.slice(-4)) : '-';
    $('content').innerHTML =
      '<div class="page-title">My Profile ' + statusChip(se.status || 'Pending') + '</div>' +
      (sh.Change_Request ? '<div class="banner">Pending change request with admin:<br>' + esc(sh.Change_Request).replace(/\n/g, '<br>') + '</div>' : '') +
      '<div class="panel"><h3>Personal Information</h3>' +
      kv('Seller ID', se.sellerId) + kv('Full Name', se.name) + kv("Father's Name", se.fatherName) +
      kv('Mobile', se.mobile) + kv('WhatsApp', se.whatsapp) + kv('Email', se.email) +
      kv('Date of Birth', se.dob) + kv('Gender', se.gender) + kv('Address', se.address) +
      kv('Village / Town', se.village) + kv('District', se.district) + kv('State', se.state) + kv('PIN Code', se.pincode) + '</div>' +
      '<div class="panel"><h3>Identity Verification</h3>' +
      kv('Status', d.profile.identityStatus) +
      '<div class="hint">Aadhaar and PAN details are protected and visible only to authorized admin. Request a correction via the form below.</div></div>' +
      '<div class="panel"><h3>Shop</h3>' + kv('Shop Name', sh.Shop_Name) + kv('Shop Address', sh.Shop_Address) + kv('Shop Mobile', sh.Shop_Mobile) +
      '<div class="mt"><button class="btn btn-ghost btn-sm" onclick="go(\'shop\')">Open My Shop</button></div></div>' +
      '<div class="panel"><h3>Bank &amp; Payment Details</h3>' +
      kv('Account Holder', bank.Holder_Name) + kv('Bank Name', bank.Bank_Name) + kv('Account Number', maskedAcct) +
      kv('IFSC Code', bank.IFSC) + kv('UPI ID', bank.UPI_ID) + '</div>' +
      '<div class="panel"><h3>Request Profile Change</h3>' +
      '<label>What should change?</label><textarea id="prf-chg" rows="3" placeholder="Example: correct my name spelling, update mobile number..."></textarea>' +
      '<button class="btn btn-lime mt" id="prf-go">Send Change Request</button></div>';
    $('prf-go').onclick = function () {
      var v = $('prf-chg').value.trim();
      if (!v) { toast('Describe the change you request.', 'err'); return; }
      call('apiRequestProfileChange', S.token, { profile: v }).then(function (r) { toast(r.message, 'ok'); refresh(); }).catch(function () {});
    };
  });
};

/* ---------- settings (role-aware) ---------- */
PAGES.settings = function () {
  if (S.role === 'admin') return adminSettings();
  $('content').innerHTML =
    '<div class="page-title">Settings</div>' +
    '<div class="panel"><h3>Change PIN</h3>' + buildFields([
      { k:'currentPin', label:'Current PIN', type:'password', req:1 },
      { k:'newPin', label:'New PIN (min 6 digits)', type:'password', req:1 },
      { k:'confirmPin', label:'Confirm New PIN', type:'password', req:1 }
    ]) + '<button class="btn btn-lime" id="pin-go">Update PIN</button></div>' +
    '<div class="panel"><h3>Notification Preferences</h3>' +
    '<div class="hint">Order, payment, meeting and notice notifications are delivered in-app and follow the platform notification settings configured by admin.</div></div>' +
    '<div class="panel"><h3>Profile &amp; Session</h3>' +
    '<div class="kv"><b>Profile</b><span>Profile and shop details are edited via change requests (Profile / My Shop pages).</span></div>' +
    '<div class="kv"><b>Session</b><span>Sessions expire automatically. Remember Me keeps you logged in longer.</span></div>' +
    '<button class="btn btn-dark mt" onclick="doLogout()">Secure Logout</button></div>';
  $('pin-go').onclick = function () {
    var cur = $('f_currentPin').value, np = $('f_newPin').value, cp = $('f_confirmPin').value;
    if (np !== cp) { toast('New PIN and confirmation do not match.', 'err'); return; }
    call('apiChangeSellerPin', S.token, cur, np).then(function (r) { toast(r.message, 'ok'); $('f_currentPin').value = ''; $('f_newPin').value = ''; $('f_confirmPin').value = ''; }).catch(function () {});
  };
};
function adminSettings() {
  return call('apiGetAdminSettings', S.token).then(function (d) {
    var app = d.app || {}, adm = d.admin || {};
    $('content').innerHTML =
      '<div class="page-title">Admin Settings</div>' +
      '<div class="panel"><h3>General / Branding</h3>' + buildFields([
        { k:'Brand_Name', label:'Brand Name', def:app.Brand_Name || 'BLYNZO' },
        { k:'Logo_URL', label:'Logo URL', def:app.Logo_URL || '', hint:'Paste a hosted image URL (Drive/CDN). Shown in header and login.' },
        { k:'App_Name', label:'App Name', def:app.App_Name || 'BLYNZO Seller Partner' },
        { k:'App_Description', label:'App Description', def:app.App_Description || '', type:'textarea' },
        { k:'Contact_Number', label:'Contact Number', def:app.Contact_Number || '' },
        { k:'Email', label:'Email', def:app.Email || '' },
        { k:'Business_Address', label:'Business Address', def:app.Business_Address || '' },
        { k:'Currency', label:'Currency Symbol', def:app.Currency || '\u20B9' }
      ]) + '<button class="btn btn-lime" id="gen-go">Save General Settings</button></div>' +
      '<div class="panel"><h3>Business Settings</h3>' + buildFields([
        { k:'Default_Commission', label:'Default Commission (%)', type:'number', def:app.Default_Commission || 10 },
        { k:'Product_Approval_Required', label:'Product Approval Required', type:'select', opts:['yes', 'no'], def:app.Product_Approval_Required || 'yes' },
        { k:'Seller_Registration_Open', label:'Seller Registration Open', type:'select', opts:['yes', 'no'], def:app.Seller_Registration_Open || 'yes' },
        { k:'Session_Hours', label:'Session Length (hours)', type:'number', def:app.Session_Hours || 12 },
        { k:'Remember_Me_Days', label:'Remember Me (days)', type:'number', def:app.Remember_Me_Days || 30 },
        { k:'Notifications_Enabled', label:'Notifications Enabled', type:'select', opts:['yes', 'no'], def:app.Notifications_Enabled || 'yes' },
        { k:'Recovery_Contact', label:'Recovery Contact (shown on admin login)', def:app.Recovery_Contact || '' }
      ]) + '<div class="hint">Seller-specific commissions are managed in the Commissions page. Payments and order settings use the Defaults above.</div>' +
      '<button class="btn btn-lime" id="biz-go">Save Business Settings</button></div>' +
      '<div class="panel"><h3>Security</h3>' + buildFields([
        { k:'currentPassword', label:'Current Admin Password', type:'password', req:1 },
        { k:'newUserId', label:'New Admin User ID (optional)' },
        { k:'newPassword', label:'New Admin Password (optional, min 8 chars)', type:'password' }
      ]) + '<div class="hint">Admin credentials are stored as salted hashes in Script Properties. They are never visible in the app or frontend code.</div>' +
      '<button class="btn btn-lime" id="cred-go">Update Admin Credentials</button> ' +
      '<button class="btn btn-danger" id="logoutall-go">Logout From All Sessions</button></div>' +
      '<div class="panel"><h3>Data &amp; Backup</h3>' +
      '<div class="kv"><b>Database</b><span>Google Sheets: BLYNZO_Database (21 sheets, auto-created by setupDatabase).</span></div>' +
      '<div class="mt">' +
      '<button class="btn btn-ghost btn-sm" onclick="exportData(\'sellers\')">Export Sellers</button> ' +
      '<button class="btn btn-ghost btn-sm" onclick="exportData(\'products\')">Export Products</button> ' +
      '<button class="btn btn-ghost btn-sm" onclick="exportData(\'orders\')">Export Orders</button> ' +
      '<button class="btn btn-ghost btn-sm" onclick="exportData(\'payments\')">Export Payments</button> ' +
      '<button class="btn btn-ghost btn-sm" onclick="exportData(\'transactions\')">Export Transactions</button> ' +
      '<button class="btn btn-ghost btn-sm" onclick="exportData(\'commissions\')">Export Commissions</button> ' +
      '<button class="btn btn-ghost btn-sm" onclick="exportData(\'logs\')">Export Audit Logs</button></div>' +
      '<div class="hint">PIN hashes and bank account numbers are excluded from exports (marked PROTECTED). Regular sheet copies serve as backups.</div></div>';
    $('gen-go').onclick = function () {
      var keys = ['Brand_Name', 'Logo_URL', 'App_Name', 'App_Description', 'Contact_Number', 'Email', 'Business_Address', 'Currency'];
      var out = {};
      keys.forEach(function (k) { out[k] = $('f_' + k).value; });
      call('apiSaveAppSettings', S.token, out).then(function (r) { toast(r.message, 'ok'); enterShell(); }).catch(function () {});
    };
    $('biz-go').onclick = function () {
      var keys = ['Default_Commission', 'Product_Approval_Required', 'Seller_Registration_Open', 'Session_Hours', 'Remember_Me_Days', 'Notifications_Enabled', 'Recovery_Contact'];
      var out = {};
      keys.forEach(function (k) { out[k] = $('f_' + k).value; });
      call('apiSaveAppSettings', S.token, out).then(function (r) { toast(r.message, 'ok'); refresh(); }).catch(function () {});
    };
    $('cred-go').onclick = function () {
      call('apiChangeAdminCredentials', S.token, $('f_currentPassword').value, $('f_newUserId').value, $('f_newPassword').value).then(function (r) {
        toast(r.message, 'ok');
        $('f_currentPassword').value = ''; $('f_newUserId').value = ''; $('f_newPassword').value = '';
      }).catch(function () {});
    };
    $('logoutall-go').onclick = function () {
      confirmDialog('Log out every session (admin and all sellers) on all devices?', function () {
        call('apiLogoutAllSessions', S.token).then(function (r) { toast(r.message, 'ok'); forceLogout('All sessions terminated. Please log in again.'); }).catch(function () {});
      }, true);
    };
  });
}
function exportData(entity) {
  call('apiExportData', S.token, entity, 'all').then(function (rows) { exportCSV(rows, 'blynzo_' + entity); }).catch(function () {});
}

/* ---------- admin: activity logs ---------- */
PAGES.logs = function () {
  var q = S.cache['log_q'] || '';
  var df = dFilterArgs('log_d');
  return call('apiGetActivityLogs', S.token, q, df[0], df[1], df[2]).then(function (list) {
    var pg = paginate('logs', list);
    var rows = pg.slice.map(function (l) {
      return '<tr><td>' + esc(String(l.Created_At || '').slice(0, 19)) + '</td><td>' + esc(l.Actor_Role) + '</td><td>' + esc(l.Actor_ID) + '</td><td>' + esc(l.Action) + '</td><td>' + esc(l.Details) + '</td></tr>';
    }).join('');
    $('content').innerHTML =
      '<div class="page-title">Activity Logs / Audit Trail <button class="btn btn-ghost btn-sm" onclick="exportData(\'logs\')">Export CSV</button></div>' +
      '<div class="searchbar"><input id="log-q" placeholder="Search actor, action, details..." value="' + esc(q) + '" onkeydown="if(event.key===\'Enter\'){S.cache[\'log_q\']=this.value;S.cache[\'pg_logs\']=1;refresh();}"></div>' +
      dateFilterBar('log_d') +
      (pg.slice.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Time</th><th>Role</th><th>Actor</th><th>Action</th><th>Details</th></tr>' + rows + '</table></div>' + pg.pager : '<div class="empty"><div class="e-ic">&#128220;</div>No log entries for this filter.</div>');
  });
};

/* ================= BOOT ================= */
window.addEventListener('load', function () {
  var start = function () {
    var tk = null, role = null, exp = 0;
    try {
      tk = localStorage.getItem('blynzo_token');
      role = localStorage.getItem('blynzo_role');
      exp = Number(localStorage.getItem('blynzo_exp') || 0);
    } catch (e) {}
    if (tk && exp > Date.now()) {
      S.token = tk; S.role = role || 'seller';
      enterShell();
    } else {
      if (tk) { try { localStorage.removeItem('blynzo_token'); localStorage.removeItem('blynzo_role'); localStorage.removeItem('blynzo_exp'); } catch (e) {} }
      renderWelcome();
    }
  };
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    api('apiPublicConfig').then(function (cfg) { S.cfg = cfg; start(); }).catch(function () { start(); });
  } else {
    start();
  }
});
</script>
